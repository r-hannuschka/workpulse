<div class="workpulse-teaser" [class.is-open]="isOpen()">
  <!-- Der workpulse-scroll-container fängt das Scrollen im offenen Zustand ab -->
  <div class="workpulse-teaser-content">
    <ng-content></ng-content>
  </div>

  <!-- Der Button toggelt einfach nur den Zustand -->
  <span class="workpulse-teaser-toggle" (click)="isOpen.set(!isOpen())" role="button">
    {{ isOpen() ? 'weniger' : 'mehr...' }}
  </span>
</div>
